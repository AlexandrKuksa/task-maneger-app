<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мои задачи</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><span class="eyebrow">TASK MANAGER</span><h1>Мои задачи</h1><p>Организуйте дела и отмечайте прогресс.</p></header><form id="task-form"><label class="sr-only" for="task-input">Новая задача</label><input id="task-input" maxlength="200" placeholder="Что нужно сделать?" required autocomplete="off"><button type="submit">Добавить</button></form><div class="summary"><span id="counter">0 задач</span><span id="progress">Выполнено: 0</span></div><ul id="task-list" aria-label="Список задач"></ul><p id="empty" class="empty">Пока нет задач. Добавьте первую!</p><p id="error" role="alert" hidden></p></main><script src="app.js" defer></script></body></html>
